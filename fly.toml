# fly.toml app configuration file generated for washa-uburudike on 2026-10-30T10:08:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'washa-uburudike'
primary_region = 'ams'
[build]
[processes]
app = "gunicorn -w 2 -b 0.0.0.0:8080 app:app"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
